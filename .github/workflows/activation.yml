name: Acquire activation file

# NOTE: this manual-activation flow only works for Unity Plus/Pro serials.
# Unity no longer supports manual activation of *Personal* licenses
# (https://license.unity3d.com/manual says so, see game-ci/unity-request-activation-file#97).
#
# For a Personal license — which is what this fork uses — do NOT run this workflow.
# Activate Unity Hub on your own machine and copy the resulting .ulf into the
# UNITY_LICENSE secret instead. See docs/release-build.md for the exact steps.

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file 🔑
    runs-on: ubuntu-latest
    steps:
      # Request manual activation file
      - name: Request manual activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: "6000.3.5f2"
      # Upload artifact (Unity_v6000.X.XXXX.alf)
      - name: Expose as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.getManualLicenseFile.outputs.filePath }}
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
