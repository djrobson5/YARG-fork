name: Build release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v0.15.0-sectionfc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        default: true
        type: boolean
      publish:
        description: "Publish a GitHub release (off: build the zips as artifacts only)"
        default: true
        type: boolean
  push:
    tags:
      - "v*-sectionfc.*"

# Only the release job writes; the builds run third-party actions with a read-only token.
permissions:
  contents: read

# Keyed on the release version rather than the ref, so a dispatch for v1.2.3 and a push of
# the v1.2.3 tag do not race each other into publishing the same release.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  ###########################
  #      Resolve inputs     #
  ###########################
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: "[Setup] Resolve version"
        id: meta
        # Inputs go through env rather than being pasted into the script, so a version
        # string cannot inject shell.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
            PRERELEASE="true"
            PUBLISH="true"
          else
            VERSION="${INPUT_VERSION}"
            PRERELEASE="${INPUT_PRERELEASE}"
            PUBLISH="${INPUT_PUBLISH}"
          fi
          # The version names the zips and artifacts, so no spaces or slashes. A published
          # release must also end in -sectionfc.<n>: that is what UpdateChecker.TagPattern and
          # update-yarg.ps1 parse, and a build tagged otherwise hides its own updater.
          if ! printf '%s' "${VERSION}" | grep -Eq '^v[^[:space:]/]+$'; then
            echo "::error::Version '${VERSION}' must start with v and contain no spaces or slashes."
            exit 1
          fi
          if [ "${PUBLISH}" = "true" ] && ! printf '%s' "${VERSION}" | grep -Eq -- '-sectionfc\.[0-9]+$'; then
            echo "::error::A published version must end in -sectionfc.<n>, e.g. v0.15.0-sectionfc.11."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

  ###########################
  #          Build          #
  ###########################
  build:
    name: ${{ matrix.name }} player
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      # One platform failing should not cancel the other's build
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            targetPlatform: StandaloneWindows64
            buildMethod: Editor.Build.CIBuild.BuildWindows
            assetSuffix: Windows-x64
          # Built on Linux like Windows: the editor image's macOS module produces the .app
          - name: macOS arm64
            targetPlatform: StandaloneOSX
            buildMethod: Editor.Build.CIBuild.BuildMac
            assetSuffix: macOS-arm64

    # Not "ZIP": Info-ZIP's zip reads $ZIP as default arguments, so the bare file name would
    # become the archive path relative to the build folder.
    env:
      ASSET_ZIP: YARG-SectionFC_${{ needs.meta.outputs.version }}-${{ matrix.assetSuffix }}.zip
      BUILD_DIR: build/${{ matrix.targetPlatform }}

    steps:
      ###########################
      #       Disk space        #
      ###########################
      # The Unity editor image plus Library/ and the built player do not fit in the
      # ~14 GB a stock ubuntu-latest runner leaves free.
      - name: "[Setup] Free disk space"
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      ###########################
      #        Checkout         #
      ###########################
      # fetch-depth: 0 because BuildGitCommitVersion runs `git rev-list --count HEAD`
      # to stamp Assets/Resources/version.txt.
      - name: "[Setup] Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      # HIDrogen is vendored into Packages/ rather than pulled from openupm, because the
      # registry copy's SharpGameInput.v0.dll is import-restricted to Windows *editors* and
      # the HIDrogen assembly therefore fails to compile in the Linux editor container.
      # .gitignore has a negation for this path; if that ever regresses, fail fast here
      # instead of 30 minutes into a Unity compile.
      - name: "[Setup] Check vendored HIDrogen is present"
        run: |
          test -f Packages/com.thenathannator.hidrogen/package.json
          test -f Packages/com.thenathannator.hidrogen/HIDrogen/Plugins/SharpGameInput.v0.dll
          grep -q "OS: AnyOS" Packages/com.thenathannator.hidrogen/HIDrogen/Plugins/SharpGameInput.v0.dll.meta

      ###########################
      #     NuGet packages      #
      ###########################
      - name: "[Setup] Install .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      # DryWetMidi / ZString / sqlite-net etc. live in the gitignored Assets/Packages
      # and must be present before Unity first compiles, or the build deadlocks on
      # hundreds of missing-type errors.
      - name: "[Setup] Restore NuGetForUnity packages"
        run: |
          dotnet tool install --global NuGetForUnity.Cli
          # `dotnet tool install --global` drops the shim in ~/.dotnet/tools, which is not
          # guaranteed to be on PATH within the same step.
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore "${GITHUB_WORKSPACE}"
          ls -alh "${GITHUB_WORKSPACE}/Assets/Packages"

      ###########################
      #          Cache          #
      ###########################
      - name: "[Setup] Restore Library cache"
        uses: actions/cache@v4
        with:
          path: Library
          key: YARG-Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            YARG-Library-${{ matrix.targetPlatform }}-
            YARG-Library-

      ###########################
      #          Build          #
      ###########################
      - name: "[Build] Run Unity builder"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.5f2
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: YARG
          buildsPath: build
          buildMethod: ${{ matrix.buildMethod }}
          # Take the version verbatim from the workflow input rather than deriving a
          # semantic version from git tags (which would also trip the dirty-tree check,
          # since NuGetForUnity writes into Assets/Packages).
          versioning: Custom
          version: ${{ needs.meta.outputs.version }}
          allowDirtyBuild: true
          # Produce build output owned by the runner user so the later steps (and the
          # Library cache save) can read and write it without sudo.
          runAsHostUser: true

      - name: "[Build] Show build output"
        run: |
          ls -alh "$BUILD_DIR"
          # unity-builder reports success from the container exit code alone, so make sure
          # the player actually exists before we try to package it.
          if [ "${{ matrix.targetPlatform }}" = "StandaloneOSX" ]; then
            test -x "$BUILD_DIR/YARG.app/Contents/MacOS/YARG"
            ls -alh "$BUILD_DIR/YARG.app/Contents/PlugIns"
            # Must be a thin arm64 Mach-O (MH_MAGIC_64 + CPU_TYPE_ARM64, little-endian): the
            # libusb dylibs have no x86_64 slice, so a universal or x64 player cannot load them.
            HEADER=$(od -An -tx1 -N8 "$BUILD_DIR/YARG.app/Contents/MacOS/YARG" | tr -d ' \n')
            if [ "$HEADER" != "cffaedfe0c000001" ]; then
              echo "::error::The macOS player is not a thin arm64 binary (header $HEADER)."
              exit 1
            fi
          else
            test -f "$BUILD_DIR/YARG.exe"
            test -d "$BUILD_DIR/YARG_Data"
          fi

      ###########################
      #        Compress         #
      ###########################
      # Unity emits sidecar folders next to the player that must not be shipped:
      # <name>_BurstDebugInformation_DoNotShip (Burst is pulled in via Collections/URP) and,
      # if the scripting backend is ever switched to IL2CPP,
      # <name>_BackUpThisFolder_ButDontShipItWithYourGame.
      # Windows zips the folder's contents so YARG.exe sits at the archive root; macOS zips
      # YARG.app itself, keeping symlinks (-y) and the executable bit.
      - name: "[Post-build] Compress to a .zip"
        run: |
          cd "$BUILD_DIR"
          rm -rf ./*_BurstDebugInformation_DoNotShip ./*_BackUpThisFolder_ButDontShipItWithYourGame
          if [ "${{ matrix.targetPlatform }}" = "StandaloneOSX" ]; then
            zip -qry "${GITHUB_WORKSPACE}/${ASSET_ZIP}" YARG.app
          else
            zip -qr "${GITHUB_WORKSPACE}/${ASSET_ZIP}" .
          fi
          cd "${GITHUB_WORKSPACE}"
          ls -alh "${ASSET_ZIP}"
          unzip -l "${ASSET_ZIP}" | head -20

      - name: "[Post-build] Upload .zip to artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_ZIP }}
          path: ${{ env.ASSET_ZIP }}
          retention-days: 14

  ###########################
  #         Release         #
  ###########################
  # One job publishes both zips, so the two builds never race to create the same release.
  release:
    name: Publish release
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "[Release] Download the zips"
        uses: actions/download-artifact@v4
        with:
          pattern: YARG-SectionFC_*
          merge-multiple: true
          path: dist

      - name: "[Release] Publish GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          # A dispatch that publishes creates the tag; pin it to the commit that was built
          # rather than the default branch's head.
          target_commitish: ${{ github.sha }}
          name: ${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*.zip
          body: |
            **Unofficial fork build.** This is not an official YARG release and is not
            supported by the YARC team — please do not report bugs from this build upstream.

            Built from `${{ github.ref_name }}` (`${{ github.sha }}`) with the **Section FC**
            feature, which tracks and displays per-section full-combo progress.

            ### Install on Windows
            1. Download the `-Windows-x64.zip` below and unzip it anywhere.
            2. Run `YARG.exe`.

            ### Install on macOS (Apple silicon)
            1. Download the `-macOS-arm64.zip` below, unzip it, and move `YARG.app` to
               Applications.
            2. The app is not notarized, so macOS blocks the first launch. Right-click
               `YARG.app` → Open → Open, or run `xattr -dr com.apple.quarantine /Applications/YARG.app`.
            3. A CRKD guitar over Bluetooth needs Input Monitoring for YARG (System Settings →
               Privacy & Security). USB and the wireless receiver need nothing.

            These builds are **not compatible with the YARC Launcher** — the launcher will not
            see them and cannot update them. Install and update them by hand.

            They are nightly-flavoured builds, so settings, scores and the song cache live in
            the nightly data folder, separate from a stable YARG install: Windows
            `%USERPROFILE%\AppData\LocalLow\YARC\YARG\nightly`, macOS
            `~/Library/Application Support/YARC/YARG/nightly`. Your official install is left
            untouched.
