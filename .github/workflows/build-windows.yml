name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version / tag (e.g. v0.15.0-sectionfc.1)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        default: true
        type: boolean
  push:
    tags:
      - "v*-sectionfc*"

permissions:
  contents: write

# Keyed on the release version rather than the ref, so a dispatch for v1.2.3 and a push of
# the v1.2.3 tag do not race each other into publishing the same release.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 player
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      ###########################
      #        Resolve inputs   #
      ###########################
      - name: "[Setup] Resolve version"
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
            PRERELEASE="true"
          else
            VERSION="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "zip=YARG-SectionFC_${VERSION}-Windows-x64.zip" >> "$GITHUB_OUTPUT"

      ###########################
      #       Disk space        #
      ###########################
      # The Unity editor image plus Library/ and the built player do not fit in the
      # ~14 GB a stock ubuntu-latest runner leaves free.
      - name: "[Setup] Free disk space"
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      ###########################
      #        Checkout         #
      ###########################
      # fetch-depth: 0 because BuildGitCommitVersion runs `git rev-list --count HEAD`
      # to stamp Assets/Resources/version.txt.
      - name: "[Setup] Checkout"
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      ###########################
      #     NuGet packages      #
      ###########################
      - name: "[Setup] Install .NET"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      # DryWetMidi / ZString / sqlite-net etc. live in the gitignored Assets/Packages
      # and must be present before Unity first compiles, or the build deadlocks on
      # hundreds of missing-type errors.
      - name: "[Setup] Restore NuGetForUnity packages"
        run: |
          dotnet tool install --global NuGetForUnity.Cli
          # `dotnet tool install --global` drops the shim in ~/.dotnet/tools, which is not
          # guaranteed to be on PATH within the same step.
          export PATH="$PATH:$HOME/.dotnet/tools"
          nugetforunity restore "${GITHUB_WORKSPACE}"
          ls -alh "${GITHUB_WORKSPACE}/Assets/Packages"

      ###########################
      #          Cache          #
      ###########################
      - name: "[Setup] Restore Library cache"
        uses: actions/cache@v4
        with:
          path: Library
          key: YARG-Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            YARG-Library-StandaloneWindows64-
            YARG-Library-

      ###########################
      #          Build          #
      ###########################
      - name: "[Build] Run Unity builder"
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.5f2
          targetPlatform: StandaloneWindows64
          buildName: YARG
          buildsPath: build
          buildMethod: Editor.Build.CIBuild.BuildWindows
          # Take the version verbatim from the workflow input rather than deriving a
          # semantic version from git tags (which would also trip the dirty-tree check,
          # since NuGetForUnity writes into Assets/Packages).
          versioning: Custom
          version: ${{ steps.meta.outputs.version }}
          allowDirtyBuild: true
          # Produce build output owned by the runner user so the later steps (and the
          # Library cache save) can read and write it without sudo.
          runAsHostUser: true

      - name: "[Build] Show build output"
        run: |
          ls -alh build/StandaloneWindows64
          # unity-builder reports success from the container exit code alone, so make sure
          # the player actually exists before we try to package it.
          test -f build/StandaloneWindows64/YARG.exe
          test -d build/StandaloneWindows64/YARG_Data

      ###########################
      #        Compress         #
      ###########################
      # Zip from inside the build folder so YARG.exe sits at the archive root.
      # Unity emits sidecar folders next to the player that must not be shipped:
      # <name>_BurstDebugInformation_DoNotShip (Burst is pulled in via Collections/URP) and,
      # if the scripting backend is ever switched to IL2CPP,
      # <name>_BackUpThisFolder_ButDontShipItWithYourGame.
      - name: "[Post-build] Compress to a .zip"
        run: |
          cd build/StandaloneWindows64
          rm -rf ./*_BurstDebugInformation_DoNotShip ./*_BackUpThisFolder_ButDontShipItWithYourGame
          zip -qr "${GITHUB_WORKSPACE}/${{ steps.meta.outputs.zip }}" .
          cd "${GITHUB_WORKSPACE}"
          ls -alh "${{ steps.meta.outputs.zip }}"
          unzip -l "${{ steps.meta.outputs.zip }}" | head -20

      - name: "[Post-build] Upload .zip to artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: ${{ steps.meta.outputs.zip }}
          retention-days: 14

      ###########################
      #         Release         #
      ###########################
      - name: "[Release] Publish GitHub release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.zip }}
          body: |
            **Unofficial fork build.** This is not an official YARG release and is not
            supported by the YARC team — please do not report bugs from this build upstream.

            Built from `${{ github.ref_name }}` (`${{ github.sha }}`) with the **Section FC**
            feature, which tracks and displays per-section full-combo progress.

            ### Install
            1. Download the `.zip` below and unzip it anywhere.
            2. Run `YARG.exe`.

            This build is **not compatible with the YARC Launcher** — the launcher will not
            see it and cannot update it. Install and update it by hand.

            It is a nightly-flavoured build, so its settings, scores and song cache live in
            `%USERPROFILE%\AppData\LocalLow\YARC\YARG\nightly` — separate from a stable YARG
            install (which uses `...\release`). Your official install is left untouched.
